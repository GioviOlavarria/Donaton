            return 204;
        }
        set $upstream_tipos2 ms-tipos;
        proxy_pass         http://$upstream_tipos2:8086;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /api/comunas {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            return 204;
        }
        set $upstream_comunas ms-comunas;
        proxy_pass         http://$upstream_comunas:8085;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /necesidades {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            return 204;
        }
        set $upstream_nec ms-necesidad;
        proxy_pass         http://$upstream_nec:8089;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
