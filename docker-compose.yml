services:

  db-centros:
    image: mysql:8.0
    container_name: donaton-db-centros
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${CENTROS_DB_NAME}
      MYSQL_USER:          ${CENTROS_DB_USER}
      MYSQL_PASSWORD:      ${CENTROS_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${CENTROS_DB_PORT}:3306"
    volumes:
      - centros-data:/var/lib/mysql
      - ./db-init/centros:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - donaton-network

  db-donantes:
    image: mysql:8.0
    container_name: donaton-db-donantes
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DONANTES_DB_NAME}
      MYSQL_USER:          ${DONANTES_DB_USER}
      MYSQL_PASSWORD:      ${DONANTES_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DONANTES_DB_PORT}:3306"
    volumes:
      - donantes-data:/var/lib/mysql
      - ./db-init/donantes:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - donaton-network

  db-beneficiarios:
    image: mysql:8.0
    container_name: donaton-db-beneficiarios
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${BENEFICIARIOS_DB_NAME}
      MYSQL_USER:          ${BENEFICIARIOS_DB_USER}
      MYSQL_PASSWORD:      ${BENEFICIARIOS_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${BENEFICIARIOS_DB_PORT}:3306"
    volumes:
      - beneficiarios-data:/var/lib/mysql
      - ./db-init/beneficiarios:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - donaton-network

  db-donaciones:
    image: mysql:8.0
    container_name: donaton-db-donaciones
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DONACIONES_DB_NAME}
      MYSQL_USER:          ${DONACIONES_DB_USER}
      MYSQL_PASSWORD:      ${DONACIONES_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DONACIONES_DB_PORT}:3306"
    volumes:
      - donaciones-data:/var/lib/mysql
      - ./db-init/donaciones:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - donaton-network

  ms-centros-acopio:
    build:
      context: ./ms-centros-acopio
      dockerfile: Dockerfile
    container_name: donaton-ms-centros
    ports:
      - "${CENTROS_APP_PORT}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-centros:3306/${CENTROS_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: ${CENTROS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${CENTROS_DB_PASSWORD}
    depends_on:
      db-centros:
        condition: service_healthy
    networks:
      - donaton-network

  ms-donantes:
    build:
      context: ./ms-donantes
      dockerfile: Dockerfile
    container_name: donaton-ms-donantes
    ports:
      - "${DONANTES_APP_PORT}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-donantes:3306/${DONANTES_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: ${DONANTES_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DONANTES_DB_PASSWORD}
    depends_on:
      db-donantes:
        condition: service_healthy
    networks:
      - donaton-network

  ms-beneficiarios:
    build:
      context: ./ms-beneficiarios
      dockerfile: Dockerfile
    container_name: donaton-ms-beneficiarios
    ports:
      - "${BENEFICIARIOS_APP_PORT}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-beneficiarios:3306/${BENEFICIARIOS_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: ${BENEFICIARIOS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${BENEFICIARIOS_DB_PASSWORD}
    depends_on:
      db-beneficiarios:
        condition: service_healthy
    networks:
      - donaton-network

  ms-donaciones:
    build:
      context: ./ms-donaciones
      dockerfile: Dockerfile
    container_name: donaton-ms-donaciones
    ports:
      - "${DONACIONES_APP_PORT}:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-donaciones:3306/${DONACIONES_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      SPRING_DATASOURCE_USERNAME: ${DONACIONES_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DONACIONES_DB_PASSWORD}
    depends_on:
      db-donaciones:
        condition: service_healthy
    networks:
      - donaton-network

  db-comunas:
    image: mysql:8.0
    container_name: donaton-db-comunas
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${COMUNAS_DB_NAME}
      MYSQL_USER:          ${COMUNAS_DB_USER}
      MYSQL_PASSWORD:      ${COMUNAS_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${COMUNAS_DB_PORT}:3306"
    volumes:
      - comunas-data:/var/lib/mysql
      - ./db-init/comunas:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - donaton-network

  db-tipos:
    image: mysql:8.0
    container_name: donaton-db-tipos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${TIPOS_DB_NAME}
      MYSQL_USER:          ${TIPOS_DB_USER}
      MYSQL_PASSWORD:      ${TIPOS_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${TIPOS_DB_PORT}:3306"
    volumes:
      - tipos-data:/var/lib/mysql
      - ./db-init/tipos:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - donaton-network

  db-auth:
    image: mysql:8.0
    container_name: donaton-db-auth
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${AUTH_DB_NAME}
      MYSQL_USER:          ${AUTH_DB_USER}
      MYSQL_PASSWORD:      ${AUTH_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${AUTH_DB_PORT}:3306"
    volumes:
      - auth-data:/var/lib/mysql
      - ./db-init/auth:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - donaton-network

  ms-comunas:
    build:
      context: ./ms-comunas
      dockerfile: Dockerfile
    container_name: donaton-ms-comunas
    ports:
      - "${COMUNAS_APP_PORT}:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-comunas:3306/${COMUNAS_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${COMUNAS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${COMUNAS_DB_PASSWORD}
    depends_on:
      db-comunas:
        condition: service_healthy
    networks:
      - donaton-network

  ms-tipos:
    build:
      context: ./ms-tipos
      dockerfile: Dockerfile
    container_name: donaton-ms-tipos
    ports:
      - "${TIPOS_APP_PORT}:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-tipos:3306/${TIPOS_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${TIPOS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TIPOS_DB_PASSWORD}
    depends_on:
      db-tipos:
        condition: service_healthy
    networks:
      - donaton-network

  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: donaton-ms-auth
    ports:
      - "${AUTH_APP_PORT}:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-auth:3306/${AUTH_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      DONATON_JWT_SECRET: ${DONATON_JWT_SECRET}
      DONATON_JWT_EXPIRATION_MS: ${DONATON_JWT_EXPIRATION_MS}
    depends_on:
      db-auth:
        condition: service_healthy
    networks:
      - donaton-network

  ms-admin:
    build:
      context: ./ms-admin
      dockerfile: Dockerfile
    container_name: donaton-ms-admin
    ports:
      - "${ADMIN_APP_PORT}:8088"
    environment:
      SVC_DONANTES: http://ms-donantes:8081
      SVC_BENEFICIARIOS: http://ms-beneficiarios:8082
      SVC_CENTROS: http://ms-centros-acopio:8083
      SVC_DONACIONES: http://ms-donaciones:8084
      SVC_COMUNAS: http://ms-comunas:8085
      SVC_TIPOS: http://ms-tipos:8086
      SVC_AUTH: http://ms-auth:8087
    depends_on:
      - ms-donantes
      - ms-beneficiarios
      - ms-centros-acopio
      - ms-donaciones
      - ms-comunas
      - ms-tipos
      - ms-auth
    networks:
      - donaton-network

volumes:
  centros-data:
  donantes-data:
  beneficiarios-data:
  donaciones-data:
  comunas-data:
  tipos-data:
  auth-data:

networks:
  donaton-network:
    driver: bridge