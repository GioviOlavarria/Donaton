spring.application.name=ms-necesidad
server.port=8089

spring.datasource.url=jdbc:mysql://db-necesidad:3306/db_necesidad?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${NECESIDAD_DB_USER}
spring.datasource.password=${NECESIDAD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
