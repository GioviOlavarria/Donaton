<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Donaton · Centros de Acopio</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f172a;--surface:#111827;--card:#1f2937;--border:#334155;--accent:#38bdf8;--accent2:#22c55e;--text:#f8fafc;--muted:#94a3b8;--danger:#fb7185;--warning:#facc15}body{background:radial-gradient(circle at top left,rgba(56,189,248,.12),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrapper{width:min(1280px,calc(100% - 32px));margin:0 auto;padding:40px 0}header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--border)}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}h1{font-size:clamp(2rem,4vw,3.25rem);line-height:1;letter-spacing:-.04em}h1 span{color:var(--accent)}.counter{background:rgba(31,41,55,.78);border:1px solid var(--border);border-radius:999px;padding:10px 18px;color:var(--muted)}.counter strong{color:var(--text);font-size:1.4rem;margin-right:6px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}.stat{background:rgba(31,41,55,.78);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 18px 55px rgba(0,0,0,.16)}.stat-label{color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}.stat-value{color:var(--accent);font-size:2rem;font-weight:900}.table-wrap{overflow-x:auto;background:rgba(31,41,55,.72);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.22)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:14px 16px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:rgba(15,23,42,.72);color:var(--muted);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}tbody tr:hover{background:rgba(56,189,248,.06)}tbody tr:last-child td{border-bottom:0}.id{color:var(--accent);font-weight:800;white-space:nowrap}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.active{background:rgba(34,197,94,.12);color:var(--accent2);border:1px solid rgba(34,197,94,.28)}.inactive,.cancelled{background:rgba(251,113,133,.12);color:var(--danger);border:1px solid rgba(251,113,133,.28)}.pending{background:rgba(250,204,21,.12);color:var(--warning);border:1px solid rgba(250,204,21,.28)}.info{background:rgba(56,189,248,.12);color:var(--accent);border:1px solid rgba(56,189,248,.28)}.empty{text-align:center;padding:72px 16px;color:var(--muted)}.empty h2{color:var(--text);margin-bottom:8px}</style></head><body><div class="wrapper"><header><div><div class="eyebrow">Donaton · Sistema de Donaciones</div><h1>Centros de <span>Acopio</span></h1></div><div class="counter"><strong th:text="${centros.size()}">0</strong>registrados</div></header><div class="stats" th:if="${!centros.isEmpty()}"><div class="stat"><div class="stat-label">Total</div><div class="stat-value" th:text="${centros.size()}">0</div></div><div class="stat"><div class="stat-label">Activos</div><div class="stat-value" th:text="${activos}">0</div></div><div class="stat"><div class="stat-label">Inactivos</div><div class="stat-value" th:text="${inactivos}">0</div></div></div><div class="table-wrap" th:if="${!centros.isEmpty()}"><table><thead><tr><th>ID</th><th>Nombre</th><th>Dirección</th><th>Comuna</th><th>Teléfono</th><th>Email</th><th>Estado</th><th>Creado en</th></tr></thead><tbody><tr th:each="centro : ${centros}"><td class="id" th:text="${centro.id}">1</td><td th:text="${centro.nombre}">-</td><td th:text="${centro.direccion}">-</td><td th:text="${centro.comuna ?: 'No especificada'}">-</td><td th:text="${centro.telefono ?: 'No registrado'}">-</td><td th:text="${centro.email ?: 'No registrado'}">-</td><td><span class="badge" th:classappend="${centro.activo ? 'active' : 'inactive'}" th:text="${centro.activo} ? 'Activo' : 'Inactivo'">-</span></td><td class="muted" th:text="${#temporals.format(centro.creadoEn, 'dd/MM/yyyy HH:mm')}">-</td></tr></tbody></table></div><div class="empty" th:if="${centros.isEmpty()}"><h2>Sin centros registrados</h2><p>No hay centros de acopio en la base de datos.</p></div></div></body></html>
