spring.application.name=ms-donaciones
server.port=8084

spring.datasource.url=jdbc:mysql://db-donaciones:3306/db_donaciones?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=donaciones_user
spring.datasource.password=donaciones_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

management.endpoints.web.exposure.include=health
