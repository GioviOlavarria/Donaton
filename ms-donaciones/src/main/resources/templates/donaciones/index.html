<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Donaton · Donaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #f5f0e8;
            --surface:  #ede6d8;
            --card:     #ffffff;
            --border:   #d4c9b5;
            --text:     #1c1710;
            --muted:    #8a7d6a;
            --accent:   #1c4e3c;
            --accent2:  #2d7a5e;
            --amber:    #d4841a;

            --pending:  #d4841a;
            --transit:  #1c6fa8;
            --delivered:#1c4e3c;
            --assigned: #6b3fa8;
            --cancelled:#a82020;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Instrument Sans', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c4b89a' fill-opacity='0.15'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
            opacity: 0.5;
        }

        .wrapper { position: relative; max-width: 1300px; margin: 0 auto; padding: 0 2.5rem; }


        header {
            padding: 3rem 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .brand {
            font-size: 0.72rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.8rem;
        }

        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        h1 i { color: var(--accent); }


        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .legend-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted);
            margin-right: 0.3rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            animation: fadeUp 0.4s ease both;
        }

        .stat-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted);
            margin-bottom: 0.6rem;
        }

        .stat-value {
            font-family: 'Instrument Serif', serif;
            font-size: 2.8rem;
            font-weight: 400;
            color: var(--accent);
            line-height: 1;
        }

        /* kanban estados */
        .kanban {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            animation: fadeUp 0.5s ease both;
        }

        .column-header {
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .column-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .col-dot { width: 8px; height: 8px; border-radius: 50%; }
        .col-count { font-family: 'Instrument Serif', serif; font-size: 1.3rem; color: var(--muted); }

        .column-items { padding: 0.8rem; display: flex; flex-direction: column; gap: 0.6rem; }

        .don-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .don-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .don-card-id {
            font-size: 0.65rem;
            color: var(--muted);
            font-family: monospace;
            margin-bottom: 0.5rem;
        }

        .don-card-article {
            font-family: 'Instrument Serif', serif;
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .don-card-qty {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 0.7rem;
        }

        .don-card-qty strong { color: var(--text); }

        .don-card-refs {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .ref-chip {
            font-size: 0.65rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.15rem 0.45rem;
            color: var(--muted);
        }

        /* ── Colores por estado ── */
        .col-PENDIENTE   .col-dot { background: var(--pending); }
        .col-EN_TRANSITO .col-dot { background: var(--transit); }
        .col-ENTREGADA   .col-dot { background: var(--delivered); }
        .col-ASIGNADA    .col-dot { background: var(--assigned); }
        .col-CANCELADA   .col-dot { background: var(--cancelled); }

        .col-PENDIENTE   .column-title { color: var(--pending); }
        .col-EN_TRANSITO .column-title { color: var(--transit); }
        .col-ENTREGADA   .column-title { color: var(--delivered); }
        .col-ASIGNADA    .column-title { color: var(--assigned); }
        .col-CANCELADA   .column-title { color: var(--cancelled); }

        .col-PENDIENTE:nth-child(1)   { animation-delay: 0.05s; }
        .col-EN_TRANSITO:nth-child(2) { animation-delay: 0.10s; }
        .col-ENTREGADA:nth-child(3)   { animation-delay: 0.15s; }
        .col-ASIGNADA:nth-child(4)    { animation-delay: 0.20s; }
        .col-CANCELADA:nth-child(5)   { animation-delay: 0.25s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .empty { text-align: center; padding: 5rem 2rem; color: var(--muted); }
        .empty h2 { font-family: 'Instrument Serif', serif; font-size: 2rem; color: var(--text); margin-bottom: 0.5rem; }

        .no-items {
            padding: 1.5rem 1rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="wrapper">

    <header>
        <div>
            <div class="brand">Donaton · Trazabilidad</div>
            <h1>Registro de <i>Donaciones</i></h1>
        </div>
    </header>


    <div class="stats" th:if="${!donaciones.isEmpty()}">
        <div class="stat">
            <div class="stat-label">Total</div>
            <div class="stat-value" th:text="${donaciones.size()}">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Pendientes</div>
            <div class="stat-value"
                 th:text="${donaciones.stream().filter(d -> d.estado.name() == 'PENDIENTE').count()}">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Entregadas</div>
            <div class="stat-value"
                 th:text="${donaciones.stream().filter(d -> d.estado.name() == 'ENTREGADA').count()}">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">En tránsito</div>
            <div class="stat-value"
                 th:text="${donaciones.stream().filter(d -> d.estado.name() == 'EN_TRANSITO').count()}">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Asignadas</div>
            <div class="stat-value"
                 th:text="${donaciones.stream().filter(d -> d.estado.name() == 'ASIGNADA').count()}">0</div>
        </div>
    </div>


    <div class="kanban" th:if="${!donaciones.isEmpty()}">

        <div th:each="estado : ${ {'PENDIENTE','EN_TRANSITO','ENTREGADA','ASIGNADA','CANCELADA'} }"
             class="column"
             th:classappend="'col-' + ${estado}">
            <div class="column-header">
                <div class="column-title">
                    <span class="col-dot"></span>
                    <span th:text="${estado.replace('_',' ')}">–</span>
                </div>
                <span class="col-count"
                      th:text="${donaciones.stream().filter(d -> d.estado.name() == estado).count()}">0</span>
            </div>
            <div class="column-items">
                <div th:each="d : ${donaciones}"
                     th:if="${d.estado.name() == estado}"
                     class="don-card">
                    <div class="don-card-id" th:text="'DON-' + ${d.id}">–</div>
                    <div class="don-card-article" th:text="${d.articulo}">–</div>
                    <div class="don-card-qty">
                        Cantidad: <strong th:text="${d.cantidad}">0</strong>
                    </div>
                    <div class="don-card-refs">
                        <span class="ref-chip" th:text="'Donante #' + ${d.donanteId}">–</span>
                        <span class="ref-chip" th:text="'Benef. #' + ${d.beneficiarioId}">–</span>
                        <span class="ref-chip" th:text="'Centro #' + ${d.centroAcopioId}">–</span>
                    </div>
                </div>
                <div class="no-items"
                     th:if="${donaciones.stream().filter(d -> d.estado.name() == estado).count() == 0}">
                    Sin donaciones
                </div>
            </div>
        </div>

    </div>

    <div class="empty" th:if="${donaciones.isEmpty()}">
        <h2>Sin donaciones registradas</h2>
        <p>No hay donaciones en el sistema todavía.</p>
    </div>

</div>
</body>
</html>
