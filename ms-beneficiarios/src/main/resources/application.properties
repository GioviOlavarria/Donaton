spring.application.name=ms-beneficiarios
server.port=8082


spring.datasource.url=jdbc:mysql://db-beneficiarios:3306/db_beneficiarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=beneficiarios_user
spring.datasource.password=beneficiarios_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


management.endpoints.web.exposure.include=health
