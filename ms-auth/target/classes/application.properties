spring.application.name=ms-auth
server.port=8087

spring.datasource.url=jdbc:mysql://db-auth:3306/db_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=auth_user
spring.datasource.password=auth_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT - el secret debe sobreescribirse por variable de entorno en produccion
donaton.jwt.secret=${DONATON_JWT_SECRET:cambia-este-secreto-por-uno-largo-y-seguro-de-al-menos-32-bytes}
donaton.jwt.expiration-ms=${DONATON_JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health
