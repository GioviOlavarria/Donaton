spring.application.name=ms-admin
server.port=8088

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.thymeleaf.encoding=UTF-8

# URLs base de los microservicios (sobreescritas por entorno en docker-compose)
donaton.services.donantes=${SVC_DONANTES:http://localhost:8081}
donaton.services.beneficiarios=${SVC_BENEFICIARIOS:http://localhost:8082}
donaton.services.centros=${SVC_CENTROS:http://localhost:8083}
donaton.services.donaciones=${SVC_DONACIONES:http://localhost:8084}
donaton.services.comunas=${SVC_COMUNAS:http://localhost:8085}
donaton.services.tipos=${SVC_TIPOS:http://localhost:8086}
donaton.services.auth=${SVC_AUTH:http://localhost:8087}

# URLs publicas (accesibles desde el navegador) de los microservicios
donaton.public.donantes=${PUB_DONANTES:http://localhost:8081}
donaton.public.beneficiarios=${PUB_BENEFICIARIOS:http://localhost:8082}
donaton.public.centros=${PUB_CENTROS:http://localhost:8083}
donaton.public.donaciones=${PUB_DONACIONES:http://localhost:8084}
donaton.public.comunas=${PUB_COMUNAS:http://localhost:8085}
donaton.public.tipos=${PUB_TIPOS:http://localhost:8086}
donaton.public.auth=${PUB_AUTH:http://localhost:8087}

management.endpoints.web.exposure.include=health
